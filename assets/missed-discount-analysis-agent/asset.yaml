apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: missed-discount-analysis-agent
  version: "1.0.0"

provides:
  apis:
    - name: missed-discount-analysis-agent
      kind: a2a
      ordId: customer.build:apiResource:discount-analysis-f8de0.missed-discount-analysis-agent:v1

container:
  buildPath: .
  port: 5000

requires:
  - name: sap-s4-supplier-invoice-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:discount-analysis-f8de0.sap-s4-supplier-invoice-mcp-server:v1

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
